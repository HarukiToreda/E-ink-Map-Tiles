name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell launcher
        run: |
          bash -n scripts/eink-map-tiles.sh
          ./scripts/eink-map-tiles.sh --help
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
      - name: Check and build browser UI
        working-directory: webui
        run: |
          npm ci
          npm run check
          npm run build
          test -f dist/index.html
      - name: Package Electron app
        working-directory: webui
        run: npm run desktop:package

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell launcher
        shell: pwsh
        run: .\scripts\eink-map-tiles.ps1 --help
